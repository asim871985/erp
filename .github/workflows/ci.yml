name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # WinForms is Windows-only and the integration tests need a real
      # PostgreSQL, so install one via chocolatey on the Windows runner.
      - name: Install PostgreSQL
        shell: pwsh
        run: |
          choco install postgresql17 --params '/Password:postgres' -y --no-progress

      # The choco-installed Windows service frequently can't start on newer
      # runner images (data-dir ACL problem, actions/runner-images#13040), so
      # don't rely on it — spin up a fresh cluster in the user-writable temp
      # dir with trust auth instead. The runner user owns that data dir, which
      # sidesteps the permission issue entirely.
      - name: Start PostgreSQL and put psql on PATH
        shell: pwsh
        run: |
          $pgBin = Get-ChildItem "$env:ProgramFiles\PostgreSQL" -Recurse -Filter psql.exe -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -like '*\bin\psql.exe' } | Select-Object -First 1
          if ($null -eq $pgBin) { throw 'psql.exe not found after install' }
          $binDir = $pgBin.DirectoryName
          Write-Host "PostgreSQL bin: $binDir"
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Stop the choco service if it happens to be running so our cluster
          # can bind port 5432 without a conflict.
          Get-Service -Name 'postgresql*' -ErrorAction SilentlyContinue | ForEach-Object {
            if ($_.Status -eq 'Running') { Stop-Service -Name $_.Name -Force; Write-Host "Stopped $($_.Name)" }
          }

          $data = Join-Path $env:RUNNER_TEMP 'pgdata'
          if (-not (Test-Path (Join-Path $data 'PG_VERSION'))) {
            & "$binDir\initdb.exe" -D $data -U postgres --auth=trust -E UTF8
            if ($LASTEXITCODE -ne 0) { throw 'initdb failed' }
          }
          & "$binDir\pg_ctl.exe" -D $data -l (Join-Path $env:RUNNER_TEMP 'pg.log') -o '-p 5432' start
          if ($LASTEXITCODE -ne 0) {
            Get-Content (Join-Path $env:RUNNER_TEMP 'pg.log') -ErrorAction SilentlyContinue
            throw 'pg_ctl could not start the cluster'
          }

          $env:PGPASSWORD = 'postgres' # trust auth, so this is never actually checked
          & psql -h localhost -U postgres -tAc 'SELECT 1'

      # The committed appsettings.json holds the developer's local password;
      # CI overrides the connection string to point at the freshly installed
      # PostgreSQL instead.
      - name: Point appsettings at the CI database
        shell: pwsh
        run: |
          $json = Get-Content -Path 'ErpApp/appsettings.json' -Raw | ConvertFrom-Json
          $json.ConnectionStrings.ErpDb = 'Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres'
          ($json | ConvertTo-Json -Depth 5) | Set-Content -Path 'ErpApp/appsettings.json' -Encoding utf8

      # Runs both test projects (ErpApp.Tests + ErpApp.IntegrationTests). The
      # integration suite creates and drops its own scratch databases.
      - name: Run all tests
        run: dotnet test --nologo
